<script>
(async()=>{

    body{padding-bottom:98px!important}
  }
  </style>`;
  const extraHTML=`<div class="premium-mobilebar" id="premium-mobilebar"><button class="active" onclick="premiumGo('play',this)"><b>⌁</b>Play</button><button onclick="premiumGo('winners',this)"><b>★</b>Winners</button><button onclick="premiumGo('prizes',this)"><b>◇</b>Prizes</button><button onclick="premiumGo('credits',this)"><b>✦</b>Credits</button></div><script>function premiumGo(name,btn){const map={play:0,winners:1,prizes:2,credits:4};const tabs=document.querySelectorAll('.tabs .tab');if(tabs[map[name]])switchTab(name,tabs[map[name]]);document.querySelectorAll('.premium-mobilebar button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}<\/script>`;
  html=html.replace('</head>',`<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">${premiumCSS}</head>`).replace('</body>',extraHTML+'</body>');
  document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:30px">Preview could not load.</p>'});
</script>
</body></html>
